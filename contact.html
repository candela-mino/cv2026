<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=devicce-witdth,initial-scale=1.0">
    <meta name="description" content="Portfolio de Diseño de Moka">
    <meta name="author" content="Candela Magalí Miño">
    <meta name="keywords" content="Portfolio">
    <title>Moka Proyecto</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="img/favicon-1.png">
</head>

<body>
    <header id="cabecera">
        <div class="contenedor">
            <a href="index.html">
                <img src="img/logo.png" alt="Icono de espiral" width="40" height="36">
            </a>
            <nav class="botonera">
                <a href="about.html">About</a>
                <a href="work.html">Work</a>
                <a href="contact.html" class="boton2">Contact</a>
            </nav>
        </div>
    </header>

    <main>
        <!-- Textos superiores + teléfono colgante -->
        <section id="hero-contact">
            <img src="img/telefono-rosa.png" alt="" class="telefono-colgante">

            <div>
                <h1 class="texto uno">¿Querés</h1>
                <h1 class="texto dos">CREAR</h1>
                <h1 class="texto tres">IDEAS</h1>
                <h1 class="texto cuatro">juntxs?</h1>
            </div>

        </section>

        <!-- Texto izquierda + formulario derecha -->
        <section id="contact-content">
            <div class="texto-contacto">
                <h3>
                    Escribí un mensaje contándome tu idea o hablame por mis redes:
                </h3>
            </div>

            <form>
                <label for="nombre" class="etiquetas-form">Nombre:</label>
                <input type="text" name="nombre" id="nombre" placeholder="Nombre o apodo" required>
                <label for="email" class="etiquetas-form">Email:</label>
                <input type="email" name="email" id="email" maxlength="100" placeholder="your@email.com" required>
                <label>Servicio:</label>
                <div class="checks">
                    <input type="checkbox">
                    <span>Diseño</span>
                    <input type="checkbox">
                    <span>Fotografía</span>
                    <input type="checkbox">
                    <span>Pintura</span>
                    <input type="checkbox">
                    <span>Ilustración</span>
                </div>
                <label>Mensaje:</label>
                <textarea name="mensaje" id="mensaje" placeholder="Acá escribís tu mensaje..." required></textarea>
                <button>ENVIAR</button>
            </form>
        </section>

        <!-- Teléfono inferior decorativo -->
        <section id="phone-bottom">
            <img src="img/telefonoentero-rosa.png" alt="teléfono antiguo rosa" class="telefono-abajo">
        </section>

    </main>

    <footer>
    <div class="contenedor">
        <h2>Seguime en mis redes!</h2>
        <div class="footer-section">
            <a href="https://www.instagram.com/mossska_of/">
                <img src="img/instagram-logo.png" alt="Logo de Instagram pixelado" width="50" height="50">
            </a>
            <a href="https://www.linkedin.com/in/candela-miño-402829404">
                <img src="img/linkedin-logo.png" alt="Logo de LinkedIn pixelado" width="50" height="50">
            </a>
        </div>
        </footer>


</body>
