            <div id="formulario">
                <h4>Trabajemos juntos!</h4>
                <form method="post" action="" target="_blank" enctype="text/plain">

                    <label for="nombre" class="etiquetas-form">Tu nombre o apodo:</label>
                    <input type="text" name="nombre" id="nombre" maxlength="30" placeholder="Marquitos1997" required>
                    <label for="email" class="etiquetas-form">E-mail:</label>
                    <input type="email" name="email" id="email" maxlength="100" placeholder="hola@gmail.com" required>
                    <h3>¿Qué servicio te gustaría?</h3>
                    <div id="checks">
                        <label><input type="checkbox" name="servicio" value="Ilustracion" id="Ilustración">Ilustración</label>
                        <label><input type="checkbox" name="servicio" value="pintura" id="pintura">Pintura</label>
                        <label><input type="checkbox" name="servicio" value="fotografía" id="fotografia">Fotografía</label>
                        <label><input type="checkbox" name="servicio" value="milanesas" id="diseño">Diseño</label>
                    <label for="mensaje" class="etiquetas-form">Mensaje*</label>
                    <textarea name="Contame un poco tu idea:" id="mensaje" placeholder="Me interesaría una pintura de una manzana azul..."
                        required></textarea>
                    <div id="enviar">
                        <input type="submit" value="Enviar">
                    </div>
                </form>
            </div>
